name: Validate core catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog and tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate core catalog
        run: python3 -m tools.validate_catalog catalog
      - name: Validate approved provider declarations
        run: python3 -m tools.core_distribution validate-providers
      - name: Test catalog validation
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
